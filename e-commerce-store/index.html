<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEase Store</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f6f8;
    color: #222;
}
header {
    background: #173b57;
    color: white;
    text-align: center;
    padding: 22px;
}
.controls {
    text-align: center;
    padding: 20px;
}
input, select, button {
    padding: 10px;
    margin: 5px;
}
button {
    background: #176b57;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
#products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    padding: 20px;
}
.product {
    background: white;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
}
.product img {
    width: 100%;
    height: 140px;
    object-fit: contain;
}
#cart {
    background: white;
    margin: 20px;
    padding: 20px;
    border-radius: 10px;
}
</style>
</head>
<body>

<header>
    <h1>🛍️ ShopEase</h1>
    <p>Your simple online shopping store</p>
</header>

<div class="controls">
    <input id="search" placeholder="Search products..." oninput="renderProducts()">
    <select id="category" onchange="renderProducts()">
        <option value="">All Categories</option>
    </select>
</div>

<p id="status" style="text-align:center">Loading products...</p>
<div id="products"></div>

<section id="cart">
    <h2>🛒 Shopping Cart</h2>
    <div id="cartItems">Your cart is empty.</div>
    <h3 id="total">Total: $0.00</h3>
    <button onclick="checkout()">Demo Checkout</button>
</section>

<script>
let allProducts = [];
let cart = JSON.parse(localStorage.getItem("shopEaseCart") || "[]");

async function loadProducts() {
    const status = document.getElementById("status");

    try {
        const response = await fetch("https://fakestoreapi.com/products");
        if (!response.ok) throw new Error("Request failed");

        allProducts = await response.json();

        const categories = [...new Set(allProducts.map(p => p.category))];
        categories.forEach(category => {
            const option = document.createElement("option");
            option.value = category;
            option.textContent = category;
            document.getElementById("category").appendChild(option);
        });

        status.textContent = "";
        renderProducts();
    } catch (error) {
        status.textContent = "Unable to load products. Please try again later.";
    }
}

function renderProducts() {
    const search = document.getElementById("search").value.toLowerCase();
    const category = document.getElementById("category").value;
    const container = document.getElementById("products");

    container.replaceChildren();

    const filtered = allProducts.filter(p =>
        p.title.toLowerCase().includes(search) &&
        (!category || p.category === category)
    );

    filtered.forEach(product => {
        const card = document.createElement("div");
        card.className = "product";

        const img = document.createElement("img");
        img.src = product.image;
        img.alt = product.title;

        const title = document.createElement("h3");
        title.textContent = product.title;

        const price = document.createElement("p");
        price.textContent = "$" + product.price.toFixed(2);

        const button = document.createElement("button");
        button.textContent = "Add to Cart";
        button.onclick = () => addToCart(product);

        card.append(img, title, price, button);
        container.appendChild(card);
    });

    if (filtered.length === 0) {
        container.textContent = "No matching products found.";
    }
}

function addToCart(product) {
    const existing = cart.find(item => item.id === product.id);

    if (existing) {
        existing.quantity++;
    } else {
        cart.push({
            id: product.id,
            title: product.title,
            price: product.price,
            quantity: 1
        });
    }

    saveCart();
}

function saveCart() {
    localStorage.setItem("shopEaseCart", JSON.stringify(cart));
    renderCart();
}

function renderCart() {
    const container = document.getElementById("cartItems");
    container.replaceChildren();

    let total = 0;

    if (cart.length === 0) {
        container.textContent = "Your cart is empty.";
    }

    cart.forEach(item => {
        total += item.price * item.quantity;

        const row = document.createElement("p");
        row.textContent =
            `${item.title} — $${item.price.toFixed(2)} × ${item.quantity} `;

        const remove = document.createElement("button");
        remove.textContent = "Remove";
        remove.onclick = () => {
            cart = cart.filter(p => p.id !== item.id);
            saveCart();
        };

        row.appendChild(remove);
        container.appendChild(row);
    });

    document.getElementById("total").textContent =
        "Total: $" + total.toFixed(2);
}

function checkout() {
    if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
    }

    alert("Demo checkout successful! This is not a real payment.");
    cart = [];
    saveCart();
}

renderCart();
loadProducts();
</script>

</body>
  </html>
